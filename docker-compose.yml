services:
  postgres:
    image: postgres:15
    container_name: quarkus-auth-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Host ports are loopback-bound and offset from the defaults: a developer machine already running
    # a Postgres, a Redis and three other stacks should not have to stop them first.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: quarkus-auth-redis
    ports:
      - "127.0.0.1:${REDIS_PORT_EXT:-16381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-api:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.compose
    container_name: quarkus-auth-api
    # Quarkus reads configuration as properties, and each one has an environment-variable spelling:
    # these are the same keys src/main/resources/application.properties carries, pointed at the
    # services above instead of localhost.
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auth}?useSSL=false&serverTimezone=UTC
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      QUARKUS_REDIS_HOSTS: redis://redis:6379/1
      # The key pair `make keys` writes into certs/, mounted read-only below.
      SMALLRYE_JWT_SIGN_KEY_LOCATION: /deployments/certs/privatekey.pem
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /deployments/certs/publickey.pem
    volumes:
      - ./certs:/deployments/certs:ro
    ports:
      - "127.0.0.1:${AUTH_PORT:-18120}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

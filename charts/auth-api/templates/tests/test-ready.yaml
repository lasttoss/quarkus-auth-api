apiVersion: v1
kind: Pod
metadata:
  name: {{ include "auth-api.fullname" . }}-test-ready
  labels:
    {{- include "auth-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'nc -z -w 5 {{ include "auth-api.fullname" . }} {{ .Values.service.httpPort }} && echo "the auth port accepts a connection"'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

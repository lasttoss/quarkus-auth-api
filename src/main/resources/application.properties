# Development defaults for the compose stack. In a real deployment these are environment variables;
# the values here are the ones .env.example documents, so a fresh clone starts without a config file.
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auth?useSSL=false&serverTimezone=UTC
quarkus.hibernate-orm.database.generation=update

quarkus.redis.hosts=redis://localhost:6379/1

# `make keys` writes these; the container mounts the same directory at /deployments/certs.
smallrye.jwt.sign.key.location=certs/privatekey.pem
mp.jwt.verify.publickey.location=certs/publickey.pem
smallrye.jwt.new-token.lifespan=3600
